name: Rodar análise

on:
  push:
    paths:
      - "dados/**"
      - "config.yaml"
      - "src/**"
      - "rodar.py"
      - "app/**"
  workflow_dispatch:
    inputs:
      exemplo:
        description: "Rodar com os dados SIMULADOS de exemplo (para testar)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analise
  cancel-in-progress: false

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Recuperar arquivos já baixados (INPE)
        uses: actions/cache@v4
        with:
          path: cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Rodar a análise
        continue-on-error: true
        id: analise
        run: |
          if [ "${{ inputs.exemplo }}" = "true" ]; then
            python exemplo/gerar_dados_exemplo.py
            python rodar.py exemplo/config_exemplo.yaml
          else
            python rodar.py config.yaml
          fi

      - name: Avisar se a análise não rodou
        if: steps.analise.outcome == 'failure'
        run: |
          echo "::warning::A análise com os dados de dados/ não rodou (faltam arquivos ou há erro). Abra a etapa 'Rodar a análise' para ver a mensagem. A calculadora on-line continua sendo publicada."
          echo "### ⚠️ A análise não rodou – veja a etapa 'Rodar a análise'. A calculadora foi publicada normalmente." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar os resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A resultados resultados_exemplo 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos resultados."
          else
            git commit -m "Atualiza resultados da análise [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Guardar os resultados para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            resultados
            resultados_exemplo
          if-no-files-found: ignore

      - name: Montar o site (calculadora + últimos resultados)
        run: |
          if [ "${{ inputs.exemplo }}" = "true" ]; then ORIGEM=resultados_exemplo; else ORIGEM=resultados; fi
          if [ ! -f "$ORIGEM/index.html" ]; then
            for d in resultados resultados_exemplo; do [ -f "$d/index.html" ] && ORIGEM=$d && break; done
          fi
          bash app/montar_site.sh _site "$ORIGEM"

      - name: Preparar a página para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pagina:
    needs: analise
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar a página (GitHub Pages)
        id: publicar
        uses: actions/deploy-pages@v4
